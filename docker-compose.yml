services:
  mysql:
    image: mariadb:10.11
    container_name: mysql
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: slurm_acct_db
      MYSQL_USER: slurm
      MYSQL_PASSWORD: password

  slurmdbd:
    image: giovtorres/slurm-docker-cluster:latest
    container_name: slurmdbd
    hostname: slurmdbd
    volumes:
      - ./scripts:/scripts
    depends_on:
      - mysql

  slurmctld:
    image: giovtorres/slurm-docker-cluster:latest
    container_name: slurmctld
    hostname: slurmctld
    volumes:
      - ./scripts:/scripts
    ports:
      - "6817:6817"
      - "6818:6818"
    depends_on:
      - slurmdbd

  c1:
    image: giovtorres/slurm-docker-cluster:latest
    container_name: c1
    hostname: c1
    depends_on:
      - slurmctld

  c2:
    image: giovtorres/slurm-docker-cluster:latest
    container_name: c2
    hostname: c2
    depends_on:
      - slurmctld