volumes:
  etc_munge:
  etc_slurm:
  var_log_slurm:

services:
  mysql:
    image: mariadb:10.11
    container_name: mysql
    hostname: mysql
    environment:
      MYSQL_ROOT_PASSWORD: "password"
      MYSQL_DATABASE: slurm_acct_db
      MYSQL_USER: slurm
      MYSQL_PASSWORD: password

  slurmdbd:
    image: giovtorres/slurm-docker-cluster:latest
    container_name: slurmdbd
    hostname: slurmdbd
    command: ["slurmdbd"]
    volumes:
      - ./scripts:/scripts:z
      - etc_munge:/etc/munge:z
      - etc_slurm:/etc/slurm:z
      - var_log_slurm:/var/log/slurm:z
    environment:
      - SLURM_JOB_COMPLETION_LOGGING=1
      - MYSQL_USER=slurm
      - MYSQL_PASSWORD=password
    depends_on:
      - mysql

  slurmctld:
    image: giovtorres/slurm-docker-cluster:latest
    container_name: slurmctld
    hostname: slurmctld
    command: ["slurmctld"]
    privileged: true
    volumes:
      - ./scripts:/scripts:z
      - etc_munge:/etc/munge:z
      - etc_slurm:/etc/slurm:z
      - var_log_slurm:/var/log/slurm:z
    ports:
      - "6817:6817"
      - "6818:6818"
    depends_on:
      - slurmdbd

  c1:
    image: giovtorres/slurm-docker-cluster:latest
    container_name: c1
    hostname: c1
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        echo "---> Starting the MUNGE Authentication service (munged) ..."
        gosu munge /usr/sbin/munged
        echo "---> Waiting for slurmctld to become active before starting slurmd..."
        until 2>/dev/null >/dev/tcp/slurmctld/6817; do
          echo "-- slurmctld is not available.  Sleeping ..."
          sleep 2
        done
        echo "-- slurmctld is now active ..."
        exec /usr/sbin/slurmd -Z -Dvvv --conf "Feature=cpu"
    privileged: true
    volumes:
      - ./scripts:/scripts:z
      - etc_munge:/etc/munge:z
      - etc_slurm:/etc/slurm:z
      - var_log_slurm:/var/log/slurm:z
    depends_on:
      - slurmctld

  c2:
    image: giovtorres/slurm-docker-cluster:latest
    container_name: c2
    hostname: c2
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        echo "---> Starting the MUNGE Authentication service (munged) ..."
        gosu munge /usr/sbin/munged
        echo "---> Waiting for slurmctld to become active before starting slurmd..."
        until 2>/dev/null >/dev/tcp/slurmctld/6817; do
          echo "-- slurmctld is not available.  Sleeping ..."
          sleep 2
        done
        echo "-- slurmctld is now active ..."
        exec /usr/sbin/slurmd -Z -Dvvv --conf "Feature=cpu"
    privileged: true
    volumes:
      - ./scripts:/scripts:z
      - etc_munge:/etc/munge:z
      - etc_slurm:/etc/slurm:z
      - var_log_slurm:/var/log/slurm:z
    depends_on:
      - slurmctld