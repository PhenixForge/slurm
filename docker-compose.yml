services:
  mysql:
    image: mariadb:10.11
    container_name: mysql
    hostname: mysql
    environment:
      MYSQL_ROOT_PASSWORD: "password"
      MYSQL_DATABASE: slurm_acct_db
      MYSQL_USER: slurm
      MYSQL_PASSWORD: password

  slurmdbd:
    image: giovtorres/slurm-docker-cluster:latest
    container_name: slurmdbd
    hostname: slurmdbd
    command: ["slurmdbd"]
    volumes:
      - ./scripts:/scripts
    environment:
      - SLURM_JOB_COMPLETION_LOGGING=1
      - MYSQL_USER=slurm
      - MYSQL_PASSWORD=password
    depends_on:
      - mysql

  slurmctld:
    image: giovtorres/slurm-docker-cluster:latest
    container_name: slurmctld
    hostname: slurmctld
    command: ["slurmctld"]
    volumes:
      - ./scripts:/scripts
    ports:
      - "6817:6817"
      - "6818:6818"
    depends_on:
      - slurmdbd

  c1:
    image: giovtorres/slurm-docker-cluster:latest
    container_name: c1
    hostname: c1
    command: ["slurmd-cpu"]
    volumes:
      - ./scripts:/scripts
    depends_on:
      - slurmctld

  c2:
    image: giovtorres/slurm-docker-cluster:latest
    container_name: c2
    hostname: c2
    command: ["slurmd-cpu"]
    volumes:
      - ./scripts:/scripts
    depends_on:
      - slurmctld